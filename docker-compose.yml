services:
  carrot:

    build:
      context: .
    image: camellialambert/carrot

    platform: linux/amd64

    container_name: carrot

    ports:
      - "${PORT_HOTE:-80}:3838" 

    volumes:
      # Partie gauche (avant les ":")  = chemin sur la machine réelle
      # Partie droite (après les ":")  = chemin correspondant DANS le conteneur
      # Tout ce que vous mettez à gauche devient visible/modifiable à droite,
      # et réciproquement : AutoSpectral écrit dans /data (à droite), donc ça
      # apparaît directement dans votre vrai dossier (à gauche).
      - "${DOSSIER_DONNEES}:/data"

    restart: unless-stopped 
